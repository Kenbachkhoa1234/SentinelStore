name: Build Both APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-store:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          cache-dependency-path: SentinelStore/**/*.gradle*
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - working-directory: SentinelStore
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-store-debug
          path: SentinelStore/app/build/outputs/apk/debug/app-debug.apk

  build-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          cache-dependency-path: SystemService/**/*.gradle*
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - working-directory: SystemService
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: system-service-debug
          path: SystemService/app/build/outputs/apk/debug/app-debug.apk