<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Tải Sentinel Store</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eaf0ff;
      background:
        radial-gradient(circle at top, #243b67 0, transparent 42%),
        #0b1020;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 460px);
      padding: 36px;
      text-align: center;
      background: rgba(18, 27, 49, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .icon {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      font-size: 40px;
      background: #1f6feb;
      border-radius: 22px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      margin: 12px 0 24px;
      color: #aebbd5;
      line-height: 1.6;
    }

    .download {
      display: block;
      width: 100%;
      padding: 15px 20px;
      color: white;
      background: #238636;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .download:hover {
      background: #2ea043;
      transform: translateY(-2px);
    }

    .meta {
      margin-top: 14px;
      color: #8290ac;
      font-size: 13px;
    }

    .note {
      margin: 28px 0 0;
      padding-top: 22px;
      text-align: left;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🛡️</div>
    <h1>Sentinel Store</h1>
    <p>Tải ứng dụng Sentinel Store dành cho thiết bị Android.</p>

    <a class="download" href="./SentinelStore.apk" download>
      Tải APK
    </a>
    <div class="meta">Phiên bản 1.0 · 5,4 MB · Android 7.0+</div>

    <p class="note">
      Nếu Android hiển thị cảnh báo, hãy cho phép trình duyệt cài đặt ứng dụng
      từ nguồn này rồi mở lại file APK.
    </p>
  </main>
</body>
</html>
